<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저축 계산기</title>
<style>
body{margin:0;background:#f5f7f3;color:#26342d;font:16px system-ui,"Noto Sans KR",sans-serif}main{max-width:700px;margin:auto;padding:20px 14px}h1{margin:0 0 6px;font-size:30px}.sub,.note{color:#68756f;line-height:1.6;font-size:13px}.card{background:white;border:1px solid #e0e7df;border-radius:16px;padding:18px;margin:14px 0}.field{margin:18px 0}label{display:block;font-weight:700;margin-bottom:8px}.row{display:flex;gap:10px;align-items:center}input[type=number],select{width:100%;min-width:0;padding:11px;border:1px solid #cfd9d1;border-radius:9px;font:inherit}input[type=range]{width:100%;accent-color:#4e806c}.value{white-space:nowrap;font-weight:700;color:#4e806c}.results{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{background:#eaf3ed;border-radius:12px;padding:13px;overflow-wrap:anywhere}.main{grid-column:1/-1;background:#4e806c;color:white}.k{font-size:13px;opacity:.85}.v{font-size:clamp(22px,5vw,32px);font-weight:800;margin-top:5px}.main .v{font-size:clamp(28px,6vw,40px)}.bar{display:flex;height:13px;border-radius:9px;overflow:hidden;background:#eee;margin:14px 0 8px}.bar span:first-child{background:#4e806c}.bar span:last-child{background:#d7b45b}.legend{font-size:12px;color:#68756f}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4e806c;margin:0 5px 0 0}.gold{background:#d7b45b;margin-left:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:10px 5px;border-bottom:1px solid #e0e7df;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#68756f}button{border:0;border-radius:9px;padding:10px 12px;font:inherit;font-weight:700;background:#edf2ee} @media(max-width:420px){.card{padding:14px}table{font-size:11px}th,td{padding:9px 3px}}
</style><main><h1>얼마나 모일까?</h1><p class="sub">매달 모으는 금액과 기간, 예상 수익률을 입력하면 최종 금액을 계산해요.</p>
<section class="card">
<div class="field"><label for="monthly">매달 모으는 금액</label><div class="row"><input id="monthly" type="number" min="0" step="10000" value="300000"><span class="value" id="ml">30만 원</span></div><input id="mr" type="range" min="0" max="2000000" step="10000" value="300000"></div>
<div class="field"><label for="duration">모으는 기간</label><div class="row"><input id="duration" type="number" min="1" max="50" step="1" value="5"><select id="durationUnit" aria-label="기간 단위" style="max-width:110px"><option value="years" selected>년</option><option value="months">개월</option></select></div><input id="durationRange" type="range" min="1" max="600" step="1" value="60"><div class="note" id="durationHint">5년</div></div>
<div class="field"><label for="rate">예상 연 수익률 (%)</label><div class="row"><input id="rate" type="number" min="0" max="30" step=".5" value="0"><span class="value" id="rl">연 0%</span></div><input id="rr" type="range" min="0" max="30" step=".5" value="0"><p class="note">수익률은 가정값이며 실제 투자 수익을 보장하지 않아요.</p></div>
<div class="field"><label for="timing">매달 납입 시점</label><select id="timing"><option value="end">매달 말에 납입</option><option value="begin">매달 초에 납입</option></select></div><button id="reset">기본값으로 초기화</button>
</section>
<section class="card"><div class="results"><div class="result main"><div class="k">예상 최종 금액</div><div class="v" id="final">1,800만 원</div><div class="k" id="period">5년 동안 매달 30만 원</div></div><div class="result"><div class="k">내가 넣은 총금액</div><div class="v" id="principal">1,800만 원</div></div><div class="result"><div class="k">예상 수익</div><div class="v" id="gain">0원</div></div></div><div class="bar"><span id="pb" style="width:100%"></span><span id="gb" style="width:0"></span></div><div class="legend"><i class="dot"></i>납입 원금 <i class="dot gold"></i>예상 수익</div><div style="margin-top:16px"><button id="shareBtn" type="button">결과 공유하기</button><span id="shareStatus" class="note" style="margin-left:8px" aria-live="polite"></span></div></section>
<section class="card"><label>기간별 예상 금액</label><div style="overflow-x:auto"><table><thead><tr><th>기간</th><th>납입 원금</th><th>예상 수익</th><th>최종 금액</th></tr></thead><tbody id="tbody"></tbody></table></div><p class="note">계산 기준: 연 수익률을 월 수익률로 환산하고 매달 같은 금액을 납입한다고 가정합니다. 세금·수수료·물가상승률은 반영하지 않았으며 실제 결과와 다를 수 있습니다.</p></section></main>
<script>
const $=id=>document.getElementById(id);
function num(id){return Number($(id).value)||0}
function fmt(n){
 n=Math.round(n);let sign=n<0?"-":"";n=Math.abs(n);
 if(n>=1e8){let e=Math.floor(n/1e8),r=Math.floor((n%1e8)/1e4);return sign+e+"억"+(r?" "+r.toLocaleString("ko-KR")+"만":"")+" 원"}
 if(n>=1e4)return sign+Math.floor(n/1e4).toLocaleString("ko-KR")+"만 원";
 return sign+n.toLocaleString("ko-KR")+"원"
}
function calc(m,months,rate,timing){
 let r=Math.pow(1+rate/100,1/12)-1,b=0;
 for(let i=0;i<months;i++){if(timing==="begin")b+=m;b*=1+r;if(timing==="end")b+=m}
 let p=m*months;return{p,f:b,g:b-p}
}
function getMonths(){
 let d=Math.max(1,num("duration"));
 return Math.min(600,Math.round($("durationUnit").value==="years"?d*12:d));
}
function syncDurationFromMonths(months){
 const unit=$("durationUnit").value;
 months=Math.max(1,Math.min(600,Math.round(months)));
 if(unit==="years"){
   months=Math.max(12,Math.min(600,Math.round(months/12)*12));
   $("duration").value=months/12;
   $("durationRange").step=12;
 } else {
   $("duration").value=months;
   $("durationRange").step=1;
 }
 $("durationRange").value=months;
}

function render(){
 let m=Math.max(0,num("monthly")),months=getMonths(),r=Math.max(0,Math.min(30,num("rate"))),t=$("timing").value;
 $("ml").textContent=fmt(m);$("rl").textContent="연 "+r+"%";
 let label=months<12?months+"개월":Math.floor(months/12)+"년";
 $("durationHint").textContent=label;
 let x=calc(m,months,r,t);
 $("final").textContent=fmt(x.f);$("principal").textContent=fmt(x.p);
 $("gain").textContent=(x.g>0?"+":"")+fmt(x.g);$("period").textContent=label+" 동안 매달 "+fmt(m);
 let pct=x.f>0?Math.max(0,Math.min(100,x.p/x.f*100)):100;
 $("pb").style.width=pct+"%";$("gb").style.width=(100-pct)+"%";
 let years=months/12;
 let ps;
 if(months<12) ps=[1,3,6,9,months].filter(v=>v<=months);
 else {ps=[1,3,5,10,20,30].filter(y=>y<=years).map(y=>y*12);if(!ps.includes(months))ps.push(months)}
 ps=[...new Set(ps)].sort((a,b)=>a-b);
 $("tbody").innerHTML=ps.map(n=>{
   let z=calc(m,n,r,t),pl=n<12?n+"개월":Math.floor(n/12)+"년";
   return `<tr><td>${pl}</td><td>${fmt(z.p)}</td><td>${z.g>=0?"+":""}${fmt(z.g)}</td><td><b>${fmt(z.f)}</b></td></tr>`
 }).join("");
}
$("durationRange").step=$("durationUnit").value==="years"?12:1;
$("monthly").addEventListener("input",render);
$("mr").addEventListener("input",()=>{$("monthly").value=$("mr").value;render()});
$("duration").addEventListener("input",render);
$("durationUnit").addEventListener("change",()=>{
 let months=getMonths();
 if($("durationUnit").value==="years"){
   months=Math.max(12,Math.min(600,Math.round(months/12)*12));
   $("duration").value=months/12;
   $("durationRange").step=12;
 } else {
   $("duration").value=months;
   $("durationRange").step=1;
 }
 $("durationRange").value=months;render()
});
$("durationRange").addEventListener("input",()=>{syncDurationFromMonths(num("durationRange"));render()});
$("rate").addEventListener("input",()=>{$("rr").value=$("rate").value;render()});
$("rr").addEventListener("input",()=>{$("rate").value=$("rr").value;render()});
$("timing").addEventListener("change",render);
$("shareBtn").addEventListener("click",async()=>{
 const monthly=Math.max(0,num("monthly")), months=getMonths(), rate=Math.max(0,Math.min(30,num("rate"))), timing=$("timing").value;
 const result=calc(monthly,months,rate,timing);
 const period=months<12?months+"개월":(months/12)+"년";
 const text=`저축·투자 계산 결과\n매달 모으는 금액: ${fmt(monthly)}\n기간: ${period}\n가정 연 수익률: ${rate}%\n납입 원금: ${fmt(result.p)}\n예상 수익: ${fmt(result.g)}\n예상 최종 금액: ${fmt(result.f)}\n\n세금·수수료·물가상승률을 제외한 단순 계산이며 실제 결과와 다를 수 있습니다.`;
 const status=$("shareStatus");
 try {
   if(navigator.share){await navigator.share({title:"저축·투자 계산 결과",text});status.textContent="공유 창을 열었어요.";}
   else if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);status.textContent="결과를 복사했어요.";}
   else {const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();status.textContent=ok?"결과를 복사했어요.":"공유가 지원되지 않는 환경이에요.";}
 } catch(e){if(e.name!=="AbortError")status.textContent="공유에 실패했어요. 다시 시도해 주세요.";}
});
$("reset").addEventListener("click",()=>{
 $("monthly").value=300000;$("mr").value=300000;
 $("duration").value=5;$("durationUnit").value="years";$("durationRange").value=60;
 $("rate").value=0;$("rr").value=0;$("timing").value="end";render()
});
render();
</script></html>
